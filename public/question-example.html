<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>内外人格色差测试 | 你的保护色 vs 真实底色</title>
    <style>
        :root {
            --bg-start: #fdf6f0;
            --bg-mid: #f9f2eb;
            --card-bg: #ffffff;
            --text-primary: #3d302b;
            --text-secondary: #6b5d55;
            --text-light: #8c7b72;
            --shadow-soft: 0 2px 16px rgba(60, 40, 30, 0.07);
            --shadow-card: 0 4px 24px rgba(60, 40, 30, 0.10);
            --shadow-elevated: 0 8px 40px rgba(60, 40, 30, 0.14);
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --transition-smooth: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-fast: 0.2s ease;

            /* 外在颜色 */
            --out-red: #F4845F;
            --out-red-light: #fde8df;
            --out-green: #8DB580;
            --out-green-light: #e8f2e5;
            --out-blue: #8BADC8;
            --out-blue-light: #e5eff6;
            --out-purple: #B8A0C8;
            --out-purple-light: #f1ebf5;

            /* 内在颜色 */
            --in-red: #D94040;
            --in-red-light: #fce8e8;
            --in-green: #5E7E5E;
            --in-green-light: #e4efe4;
            --in-blue: #3D5A80;
            --in-blue-light: #e3eaf2;
            --in-purple: #5C3D6E;
            --in-purple-light: #efe8f3;

            --gold: #c8a87c;
            --gold-light: #f7efe3;
            --accent-rose: #e8c5b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(170deg, #fdf6f0 0%, #f9efe6 25%, #faf3ed 50%, #fdf7f2 75%, #fefaf6 100%);
            background-attachment: fixed;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 背景装饰光晕 */
        body::before {
            content: '';
            position: fixed;
            top: -15%;
            left: -25%;
            width: 70%;
            height: 60%;
            background: radial-gradient(ellipse at center, rgba(244, 132, 95, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: bgGlow1 12s ease-in-out infinite;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -10%;
            right: -20%;
            width: 60%;
            height: 55%;
            background: radial-gradient(ellipse at center, rgba(141, 181, 128, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: bgGlow2 15s ease-in-out infinite;
        }
        @keyframes bgGlow1 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(3%, -2%) scale(1.08);
            }
            66% {
                transform: translate(-2%, 2%) scale(0.94);
            }
        }
        @keyframes bgGlow2 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            40% {
                transform: translate(-3%, 3%) scale(1.06);
            }
            80% {
                transform: translate(2%, -1%) scale(0.95);
            }
        }

        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            min-height: 560px;
        }

        /* 卡片通用 */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            box-shadow: var(--shadow-card);
            transition: all var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }
        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--out-red), var(--out-purple), var(--out-blue), var(--out-green));
            border-radius: 3px 3px 0 0;
            opacity: 0.55;
        }

        /* 页面切换动画 */
        .page {
            display: none;
            animation: fadeSlideIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeSlideOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-14px);
            }
        }
        .page.exiting {
            animation: fadeSlideOut 0.35s ease forwards;
        }

        /* ========== 欢迎页 ========== */
        .welcome-icon {
            text-align: center;
            font-size: 56px;
            margin-bottom: 10px;
            animation: floatIcon 3s ease-in-out infinite;
            display: block;
        }
        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }
        .welcome-title {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .welcome-subtitle {
            font-size: 14px;
            text-align: center;
            color: var(--text-light);
            margin-bottom: 22px;
            line-height: 1.5;
        }
        .welcome-tagline {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            background: #fdf8f3;
            border-radius: 20px;
            padding: 8px 16px;
            margin: 0 auto 20px;
            width: fit-content;
            letter-spacing: 0.3px;
        }
        .welcome-tagline .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            animation: dotPulse 1.8s ease-in-out infinite;
        }
        .welcome-tagline .dot:nth-child(1) {
            background: var(--out-red);
            animation-delay: 0s;
        }
        .welcome-tagline .dot:nth-child(3) {
            background: var(--out-blue);
            animation-delay: 0.3s;
        }
        .welcome-tagline .dot:nth-child(5) {
            background: var(--out-green);
            animation-delay: 0.6s;
        }
        @keyframes dotPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.7);
                opacity: 1;
            }
        }

        /* ========== 按钮 ========== */
        .btn {
            display: block;
            width: 100%;
            padding: 15px 20px;
            font-size: 17px;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all var(--transition-bounce);
            text-align: center;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            color: #fff;
        }
        .btn:active {
            transform: scale(0.96);
            transition: all 0.1s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #5C3D6E 0%, #3D5A80 50%, #5E7E5E 100%);
            background-size: 200% 200%;
            animation: btnShimmer 4s ease infinite;
            box-shadow: 0 6px 20px rgba(60, 40, 50, 0.22);
        }
        @keyframes btnShimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .btn-secondary {
            background: #fff;
            color: var(--text-primary);
            border: 1.5px solid #e5dcd4;
            box-shadow: var(--shadow-soft);
        }
        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1.5px solid #d5c8bb;
            box-shadow: none;
        }
        .btn-small {
            padding: 10px 18px;
            font-size: 14px;
            width: auto;
            display: inline-block;
            border-radius: 25px;
        }
        .btn-gold {
            background: linear-gradient(135deg, #c8a87c 0%, #d4b896 50%, #bf9d6e 100%);
            box-shadow: 0 4px 16px rgba(180, 140, 100, 0.35);
            color: #fff;
        }

        /* ========== 选项卡片 ========== */
        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            border: 2px solid #ece4db;
            background: #fefdfb;
            transition: all var(--transition-fast);
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        .option-item:active {
            transform: scale(0.975);
            transition: all 0.1s ease;
        }
        .option-item:hover {
            border-color: #d5c8bb;
            background: #fdf9f5;
        }
        .option-item.selected {
            border-color: #b8a0c8;
            background: #f9f4fb;
            box-shadow: 0 0 0 4px rgba(184, 160, 200, 0.12);
            animation: selectPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes selectPop {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.03);
            }
            100% {
                transform: scale(1);
            }
        }
        .option-letter {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            flex-shrink: 0;
            color: #fff;
            letter-spacing: 0;
        }
        .option-letter.letter-a {
            background: var(--out-red);
        }
        .option-letter.letter-b {
            background: var(--out-green);
        }
        .option-letter.letter-c {
            background: var(--out-blue);
        }
        .option-letter.letter-d {
            background: var(--out-purple);
        }
        .option-text {
            font-size: 15px;
            color: var(--text-primary);
            line-height: 1.4;
            font-weight: 500;
        }

        /* ========== 进度条 ========== */
        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 18px;
        }
        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e5dcd4;
            transition: all var(--transition-smooth);
        }
        .progress-dot.done {
            background: #b8a0c8;
            box-shadow: 0 0 8px rgba(184, 160, 200, 0.4);
        }
        .progress-dot.current {
            background: #5C3D6E;
            box-shadow: 0 0 12px rgba(92, 61, 110, 0.5);
            transform: scale(1.25);
            animation: dotCurrentPulse 1.5s ease-in-out infinite;
        }
        @keyframes dotCurrentPulse {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(92, 61, 110, 0.4);
            }
            50% {
                box-shadow: 0 0 18px rgba(92, 61, 110, 0.7);
            }
        }
        .progress-line {
            flex: 1;
            height: 2px;
            background: #e5dcd4;
            border-radius: 1px;
            transition: all var(--transition-smooth);
        }
        .progress-line.done {
            background: #b8a0c8;
        }
        .question-label {
            font-size: 12px;
            color: var(--text-light);
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .question-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
            letter-spacing: 0.3px;
        }

        /* ========== 过渡页 ========== */
        .transition-page {
            text-align: center;
            padding: 40px 20px;
        }
        .transition-emoji {
            font-size: 64px;
            animation: floatIcon 2.5s ease-in-out infinite;
        }
        .transition-text {
            font-size: 18px;
            color: var(--text-secondary);
            margin-top: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .transition-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }
        .transition-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #d5c8bb;
            animation: dotBounce 1.4s ease-in-out infinite;
        }
        .transition-dots span:nth-child(1) {
            animation-delay: 0s;
        }
        .transition-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .transition-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes dotBounce {
            0%,
            80%,
            100% {
                transform: scale(0.7);
                opacity: 0.4;
            }
            40% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        /* ========== 结果页 ========== */
        .result-color-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 16px 0 20px;
            flex-wrap: wrap;
        }
        .color-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.13);
            position: relative;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .color-circle.outer-circle {
            animation-delay: 0.1s;
        }
        .color-circle.inner-circle {
            animation-delay: 0.3s;
        }
        @keyframes popIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .color-circle .color-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .color-circle .color-name {
            font-size: 13px;
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .color-vs {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-light);
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            animation-delay: 0.5s;
            opacity: 0;
            animation-fill-mode: forwards;
        }
        .result-title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            letter-spacing: 0.4px;
        }
        .result-subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 16px;
            letter-spacing: 0.3px;
        }
        .result-description {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-secondary);
            text-align: center;
            padding: 16px;
            background: #fdf9f5;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            letter-spacing: 0.3px;
        }
        .result-description .highlight {
            font-weight: 700;
            color: var(--text-primary);
            background: linear-gradient(180deg, transparent 60%, rgba(200, 168, 124, 0.2) 60%);
            padding: 0 2px;
        }
        .result-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .result-tag {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
            background: #fdf8f3;
            color: var(--text-secondary);
            border: 1px solid #e8ddd3;
        }
        .share-hint {
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
            margin: 12px 0 8px;
            letter-spacing: 0.3px;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        /* ========== 弹窗 ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(40, 25, 18, 0.55);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: overlayIn 0.3s ease;
        }
        @keyframes overlayIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-dialog {
            background: #fff;
            border-radius: var(--radius-xl);
            padding: 28px 22px;
            width: 100%;
            max-width: 380px;
            box-shadow: var(--shadow-elevated);
            animation: modalPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
        }
        @keyframes modalPop {
            from {
                transform: scale(0.85) translateY(30px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .modal-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #e5dcd4;
            border-radius: var(--radius-md);
            text-align: center;
            letter-spacing: 2px;
            font-weight: 600;
            transition: all var(--transition-fast);
            outline: none;
            background: #fefdfb;
            color: var(--text-primary);
        }
        .modal-input:focus {
            border-color: #b8a0c8;
            box-shadow: 0 0 0 4px rgba(184, 160, 200, 0.1);
        }
        .modal-hint {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 8px;
            letter-spacing: 0.3px;
        }
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #3d302b;
            color: #fff;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            z-index: 200;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), toastOut 0.35s ease 2s forwards;
            pointer-events: none;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(-14px);
            }
        }

        /* 深度报告内容 */
        .deep-report {
            text-align: left;
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            max-height: 50vh;
            overflow-y: auto;
            padding-right: 4px;
        }
        .deep-report h3 {
            font-size: 16px;
            color: var(--text-primary);
            margin: 12px 0 6px;
            letter-spacing: 0.5px;
        }
        .deep-report .emoji-bullet {
            display: inline-block;
            margin-right: 4px;
        }

        /* 响应式 */
        @media (max-width: 380px) {
            .card {
                padding: 22px 16px;
                border-radius: var(--radius-md);
            }
            .welcome-title {
                font-size: 22px;
            }
            .question-title {
                font-size: 18px;
            }
            .color-circle {
                width: 66px;
                height: 66px;
            }
            .color-circle .color-name {
                font-size: 11px;
            }
            .result-title {
                font-size: 19px;
            }
            .btn {
                padding: 13px 16px;
                font-size: 15px;
            }
            .option-item {
                padding: 12px 14px;
                gap: 10px;
            }
            .option-text {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">
        <!-- 页面容器由JS动态渲染 -->
    </div>

    <!-- Toast容器 -->
    <div id="toast-container"></div>

    <!-- 弹窗容器 -->
    <div id="modal-container"></div>

    <script>
        (function() {
            // ==================== 数据定义 ====================

            // 颜色映射
            const OUTER_COLORS = {
                'A': { name: '日光橙', hex: '#F4845F', hexLight: '#fde8df', emoji: '☀️', label: '外在色' },
                'B': { name: '浅草绿', hex: '#8DB580', hexLight: '#e8f2e5', emoji: '🌿', label: '外在色' },
                'C': { name: '雾霾蓝', hex: '#8BADC8', hexLight: '#e5eff6', emoji: '🌫️', label: '外在色' },
                'D': { name: '薄藤紫', hex: '#B8A0C8', hexLight: '#f1ebf5', emoji: '🪻', label: '外在色' }
            };

            const INNER_COLORS = {
                'A': { name: '朱红', hex: '#D94040', hexLight: '#fce8e8', emoji: '🔥', label: '内在色' },

                    desc: '你给人一种神秘、不好惹的印象，仿佛不需要任何人。可实际上，你内心无比渴望简单安稳的关系，向往那种一屋两人、三餐四季的平静生活。<span class="highlight">你的疏离只是保护色，怕被看穿后无人珍惜你的慢热与深情。</span>',
                    tags: ['外冷内柔', '渴望安稳', '保护色深', '深情慢热'],
                    deepTitle: '💜💚 柔软内核型人格深度报告',
                    deepContent: `<h3>🛡️ 你的保护机制</h3><p>你用神秘感筑起围墙，但墙内是一个柔软的花园。你不是不需要人，而是太清楚自己需要什么样的人——那些愿意慢慢敲门的人，才值得进入你的世界。</p><h3>⚡ 优势与盲点</h3><p><b>优势：</b>对人际关系有天然的筛选能力，能识别真正值得的人。<br><b>盲点：</b>围墙太高，有时连对的人也进不来。你的保护可能变成孤立。</p><h3>🌱 成长建议</h3><p>试着在围墙上开一扇窗。不需要推倒整面墙，只需要让一些人看到里面的风景。真正值得的人会耐心地找到门。</p>`
                },
                'D_C': {
                    title: '神秘面纱下的深邃灵魂',
                    subtitle: '外在薄藤紫 · 内在深海蓝',
                    desc: '你散发着神秘的气质，让人好奇却不敢轻易靠近。而你的内心是一片深蓝——充满深度思考与精神探索。<span class="highlight">你的神秘不是空洞的，而是因为你的内在太过丰富，无法用简单的方式呈现。</span>',
                    tags: ['神秘深邃', '精神探索', '丰富内在', '独特气质'],
                    deepTitle: '💜💙 深邃神秘型人格深度报告',
                    deepContent: `<h3>🌌 你的精神世界</h3><p>你是那种"越探索越觉得深不可测"的人。你的神秘感来自于你内在的丰富——你有太多层次，每一层都值得细细品味。你不是故意保持距离，而是你的深度自然形成了边界。</p><h3>⚡ 优势与盲点</h3><p><b>优势：</b>拥有极强的洞察力和精神深度，是天然的哲学家和思想者。<br><b>盲点：</b>可能因为太过深邃而难以被理解，偶尔会感到孤独。</p><h3>🌱 成长建议</h3><p>偶尔浮出水面，让阳光照进你的深海。你的深邃不需要永远藏在暗处——分享一部分，你会发现理解你的人比你想象的多。</p>`
                },
                'D_D': {
                    title: '彻底的梦幻旅人',
                    subtitle: '外在薄藤紫 · 内在暗夜紫',
                    desc: '你从头到尾都散发着梦幻与神秘的气息。你不属于任何固定的框架，像一阵紫色的风，自由地穿梭在现实与幻想之间。<span class="highlight">你的存在本身就是一种艺术。在这个讲究"实用"的世界里，你提醒着人们：美和想象同样重要。</span>',
                    tags: ['内外一致', '梦幻自由', '艺术灵魂', '不被定义'],
                    deepTitle: '💜💜 梦幻旅人型人格深度报告',
                    deepContent: `<h3>🦋 你的自由本质</h3><p>你是极少数完全拥抱自己独特性的人。你的内外一致不是"简单"，而是"纯粹"——你清楚地知道自己是谁，并且不打算为任何人改变。这种纯粹让你拥有磁石般的魅力。</p><h3>⚡ 优势与盲点</h3><p><b>优势：</b>创造力爆棚，拥有独特的审美和视角。你是潮流的创造者而非跟随者。<br><b>盲点：</b>有时过于沉浸在自己的世界里，可能忽略现实的细节。</p><h3>🌱 成长建议</h3><p>保持你的梦幻，但也偶尔落地。现实世界需要你的美，而你也需要现实的土壤来承载你的梦想。找到那个平衡点。</p>`
                }
            };

            // ==================== 状态管理 ====================
            const state = {
                currentPage: 'welcome',
                currentQuestion: 1,
                answers: [], // [{questionIndex, optionLetter}]
                outerColor: null,
                innerColor: null,
                resultKey: null,
                deepUnlocked: false,
            };

            // ==================== 设备限制（单设备单次测试） ====================
            const STORAGE_KEY = 'personalityColorTest_result';

            function saveTestResult() {
                const data = {
                    answers: state.answers,
                    outerColor: state.outerColor,
                    innerColor: state.innerColor,
                    resultKey: state.resultKey,
                    timestamp: Date.now()
                };
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch(e) {
                    console.warn('无法保存测试结果到本地存储', e);
                }
            }

            function getSavedTestResult() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        return JSON.parse(saved);
                    }
                } catch(e) {}
                return null;
            }

            function loadSavedResult(saved) {
                state.answers = saved.answers || [];
                state.outerColor = saved.outerColor;
                state.innerColor = saved.innerColor;
                state.resultKey = saved.resultKey;
                state.currentPage = 'result';
                state.deepUnlocked = false;
                renderResult();
            }

            // ==================== DOM操作 ====================
            const appEl = document.getElementById('app');
            const toastContainer = document.getElementById('toast-container');
            const modalContainer = document.getElementById('modal-container');

            function showToast(message, duration = 2200) {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = message;
                toastContainer.appendChild(toast);
                setTimeout(() => {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                }, duration + 400);
            }

            function showModal(htmlContent) {
                modalContainer.innerHTML = `
                <div class="modal-overlay" id="modal-overlay">
                  <div class="modal-dialog">
                    ${htmlContent}
                  </div>
                </div>
              `;
                const overlay = document.getElementById('modal-overlay');
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) closeModal();
                });
            }

            function closeModal() {
                modalContainer.innerHTML = '';
            }

            function scrollToTop() {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                appEl.scrollIntoView({ behavior: 'smooth' });
            }

            // ==================== 页面渲染 ====================
            function renderWelcome() {
                state.currentPage = 'welcome';
                state.answers = [];
                state.outerColor = null;
                state.innerColor = null;
                state.resultKey = null;
                state.deepUnlocked = false;
                state.currentQuestion = 1;
                closeModal();
                scrollToTop();

                appEl.innerHTML = `
                <div class="page active" id="page-welcome">
                  <div class="card">
                    <span class="welcome-icon">🎨</span>
                    <h1 class="welcome-title">内外人格色差测试</h1>
                    <p class="welcome-subtitle">别人眼中的你 vs 真实的你<br>差了多远？</p>
                    <div class="welcome-tagline">
                      <span class="dot"></span> 外在保护色 <span class="dot"></span> 内在真实色 <span class="dot"></span>
                    </div>
                    <p style="text-align:center;font-size:13px;color:#8c7b72;margin-bottom:18px;line-height:1.6;">
                      4道选择题 · 约1分钟完成<br>揭示你独一无二的人格色差
                    </p>
                    <button class="btn btn-primary" onclick="startTest()">
                      ✨ 开始测试
                    </button>
                    <p style="text-align:center;font-size:11px;color:#b5a599;margin-top:10px;">
                      趣味测试 · 仅供参考 · 非心理诊断
                    </p>
                  </div>
                </div>
              `;
            }

            function renderQuestion(qIndex) {
                state.currentPage = 'question';
                state.currentQuestion = qIndex;
                closeModal();
                scrollToTop();

                const questions = getQuestions();
                const q = questions[qIndex - 1];
                const totalQ = questions.length;

                // 构建进度条
                let progressHTML = '';
                for (let i = 1; i <= totalQ; i++) {
                    if (i < qIndex) progressHTML +=
                        `<span class="progress-dot done"></span>${i < totalQ ? '<span class="progress-line done"></span>' : ''}`;
                    else if (i === qIndex) progressHTML +=
                        `<span class="progress-dot current"></span>${i < totalQ ? '<span class="progress-line"></span>' : ''}`;
                    else progressHTML +=
                        `<span class="progress-dot"></span>${i < totalQ ? '<span class="progress-line"></span>' : ''}`;
                }

                const letters = ['A', 'B', 'C', 'D'];
                const letterClasses = ['letter-a', 'letter-b', 'letter-c', 'letter-d'];

                let optionsHTML = q.options.map((opt, idx) => `
                <li class="option-item" data-letter="${letters[idx]}" onclick="selectOption(${qIndex}, '${letters[idx]}', this)">
                  <span class="option-letter ${letterClasses[idx]}">${letters[idx]}</span>
                  <span class="option-text">${opt}</span>
                </li>
              `).join('');

                // 检查是否有已选答案
                const existingAnswer = state.answers.find(a => a.questionIndex === qIndex);

                appEl.innerHTML = `
                <div class="page active" id="page-question-${qIndex}">
                  <div class="card">
                    <div class="progress-wrap">${progressHTML}</div>
                    <div class="question-label">第 ${qIndex} 题 / 共 ${totalQ} 题 · ${q.label}</div>
                    <div class="question-title">${q.title}</div>
                    <ul class="options-list">${optionsHTML}</ul>
                  </div>
                </div>
              `;

                // 如果之前有答案，恢复选中状态
                if (existingAnswer) {
                    const optionEl = document.querySelector(`.option-item[data-letter="${existingAnswer.optionLetter}"]`);
                    if (optionEl) optionEl.classList.add('selected');
                }
            }

            function selectOption(qIndex, letter, el) {
                // 移除同题其他选项的选中状态
                const allOptions = el.parentElement.querySelectorAll('.option-item');
                allOptions.forEach(opt => opt.classList.remove('selected'));
                // 添加选中状态
                el.classList.add('selected');

                // 保存答案
                const existingIdx = state.answers.findIndex(a => a.questionIndex === qIndex);
                if (existingIdx >= 0) {
                    state.answers[existingIdx].optionLetter = letter;
                } else {
                    state.answers.push({ questionIndex: qIndex, optionLetter: letter });
                }

                // 短暂延迟后跳转
                setTimeout(() => {
                    if (qIndex < 4) {
                        renderQuestion(qIndex + 1);
                    } else if (qIndex === 4) {
                        // 所有题目完成，计算并显示结果
                        calculateResult();
                        renderTransition();
                    }
                }, 280);
            }

            function renderTransition() {
                state.currentPage = 'transition';
                closeModal();
                scrollToTop();

                appEl.innerHTML = `
                <div class="page active" id="page-transition">
                  <div class="card transition-page">
                    <div class="transition-emoji">🔮</div>
                    <p class="transition-text">正在解析你的人格色差…</p>
                    <div class="transition-dots">
                      <span></span><span></span><span></span>
                    </div>
                  </div>
                </div>
              `;

                // 1.8秒后显示结果
                setTimeout(() => {
                    renderResult();
                }, 1800);
            }

            function calculateResult() {
                // 前2题决定外在颜色（取第一题为主）
                const outerAnswer = state.answers.find(a => a.questionIndex === 1);
                const innerAnswer = state.answers.find(a => a.questionIndex === 3);

                state.outerColor = outerAnswer ? outerAnswer.optionLetter : 'A';
                state.innerColor = innerAnswer ? innerAnswer.optionLetter : 'A';
                state.resultKey = `${state.outerColor}_${state.innerColor}`;

                // 确保结果存在
                if (!RESULT_DATA[state.resultKey]) {
                    state.resultKey = 'A_C'; // 默认回退
                    state.outerColor = 'A';
                    state.innerColor = 'C';
                }

                // 保存测试结果到本地（限制单设备单次测试）
                saveTestResult();
            }

            function renderResult() {
                state.currentPage = 'result';
                state.deepUnlocked = false;
                closeModal();
                scrollToTop();

                const result = RESULT_DATA[state.resultKey];
                const outerData = OUTER_COLORS[state.outerColor];
                const innerData = INNER_COLORS[state.innerColor];

                if (!result || !outerData || !innerData) {
                    // 回退
                    state.resultKey = 'A_C';
                    state.outerColor = 'A';
                    state.innerColor = 'C';
                    return renderResult();
                }

                appEl.innerHTML = `
                <div class="page active" id="page-result">
                  <div class="card">
                    <div class="result-color-display">
                      <div class="color-circle outer-circle" style="background:${outerData.hex};">
                        <span class="color-label">外在</span>
                        <span class="color-name">${outerData.name}</span>
                      </div>
                      <span class="color-vs">×</span>
                      <div class="color-circle inner-circle" style="background:${innerData.hex};">
                        <span class="color-label">内在</span>
                        <span class="color-name">${innerData.name}</span>
                      </div>
                    </div>
                    <div class="result-title">${result.title}</div>
                    <div class="result-subtitle">${result.subtitle}</div>
                    <div class="result-description">${result.desc}</div>
                    <div class="result-tags">
                      ${result.tags.map(t => `<span class="result-tag">${t}</span>`).join('')}
                    </div>

                    <div style="text-align:center;margin-top:10px;padding-top:18px;border-top:1px solid #f0e8e0;">
                      <p style="font-size:13px;color:#8c7b72;letter-spacing:0.3px;line-height:1.6;">
                        ✅ 你已完成人格色差测试
                      </p>
                    </div>
                    <p style="text-align:center;font-size:11px;color:#b5a599;margin-top:10px;">
                      趣味测试 · 仅供参考 · 非心理诊断
                    </p>
                  </div>
                </div>
              `;
            }

            function getQuestions() {
                return [
                    { // 第1题 - 外在
                        label: '测外在人格色',
                        title: '在聚会或新环境中，你最容易给人留下的第一印象是？',
                        options: [
                            '活络气氛，自来熟，全场焦点',
                            '温和安静，习惯照顾他人感受',
                            '话不多但一开口就很有观点，偏观察者',
                            '自带疏离感，让人好奇但不敢轻易靠近'
                        ]
                    }, { // 第2题 - 外在
                        label: '测外在人格色',
                        title: '你在社交媒体上最常发布或浏览的内容偏向？',
                        options: [
                            '热闹生活：聚会、搞笑日常、当下热梗',
                            '微小确幸：风景、美食、治愈系图文',
                            '深度内容：书影评、逻辑分析、知识干货',
                            '小众审美：艺术、暗调摄影、意识流表达'
                        ]
                    }, { // 第3题 - 内在
                        label: '测内在人格色',
                        title: '当你一个人待着，没有任何外界要求时，你内心最常浮现的状态是？',
                        options: [
                            '有点空落落的，想找人连接，想去做点什么刺激的事',
                            '感到平和而柔软，享受这种缓慢的节奏，像被自然拥抱',
                            '思绪翻涌，不停自我对话或陷入沉思，大脑根本停不下来',
                            '生出许多梦幻或脱离现实的灵感，想逃离此刻去远方'
                        ]
                    }, { // 第4题 - 内在
                        label: '测内在人格色',
                        title: '如果剥离所有社会身份，你内心深处最渴望成为的样子是？',
                        options: [
                            '热烈鲜活的冒险家，尽情燃烧，不怕受伤',
                            '植物般安静生长的人，拥有稳定而温柔的内心秩序',
                            '清醒深邃的洞察者，看懂世界，拥有精神自由',
                            '自由漂泊的旅人，体验千万种人生，不被定义'
                        ]
                    }
                ];
            }

            // ==================== 全局函数暴露 ====================
            window.startTest = function() {
                // 设备限制：已完成的测试不允许重新开始
                const saved = getSavedTestResult();
                if (saved && saved.resultKey) {
                    loadSavedResult(saved);
                    return;
                }
                state.answers = [];
                state.outerColor = null;
                state.innerColor = null;
                state.resultKey = null;
                state.deepUnlocked = false;
                state.currentQuestion = 1;
                renderQuestion(1);
            };
            window.selectOption = selectOption;
            window.closeModal = closeModal;

            // ==================== 键盘支持 ====================
            document.addEventListener('keydown', function(e) {
                if (state.currentPage === 'question') {
                    const keyMap = { '1': 'A', '2': 'B', '3': 'C', '4': 'D', 'a': 'A', 'b': 'B', 'c': 'C',
                        'd': 'D' };
                    const letter = keyMap[e.key];
                    if (letter) {
                        const optionEl = document.querySelector(`.option-item[data-letter="${letter}"]`);
                        if (optionEl && !optionEl.classList.contains('selected')) {
                            selectOption(state.currentQuestion, letter, optionEl);
                        }
                    }
                }
                // ESC关闭弹窗
                if (e.key === 'Escape') {
                    closeModal();
                }
            });

            // ==================== 初始化 ====================
            // 设备限制：检查是否已完成测试，若已完成则直接显示结果
            const savedResult = getSavedTestResult();
            if (savedResult && savedResult.resultKey && RESULT_DATA[savedResult.resultKey]) {
                loadSavedResult(savedResult);
            } else {
                renderWelcome();
            }

            // 添加shake动画样式
            const shakeStyle = document.createElement('style');
            shakeStyle.textContent = `
              @keyframes shake {
                0%,100% { transform: translateX(0); }
                20% { transform: translateX(-6px); }
                40% { transform: translateX(6px); }
                60% { transform: translateX(-4px); }
                80% { transform: translateX(4px); }
              }
            `;
            document.head.appendChild(shakeStyle);

            console.log('🎨 内外人格色差测试已就绪');
            console.log('🔒 已启用单设备单次测试限制');
            console.log('📱 适配移动端 | 16种人格组合');
        })();
    </script>
</body>
</html>
