<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Outer and Inner Color Test</title>
  <script src="access-gate.js"></script>
  <style>
    :root{--ink:#1e293b;--muted:#64748b;--surface:#ffffff;--line:#e2e8f0;--accent:#6366f1;--accent-dark:#4f46e5;--page:#f5f7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#e0e7ff 0,transparent 28%),radial-gradient(circle at 90% 95%,#fae8ff 0,transparent 26%),var(--page);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(720px,calc(100% - 32px));margin:0 auto;padding:42px 0 60px}.card{background:rgba(255,255,255,.94);border:1px solid rgba(226,232,240,.9);border-radius:28px;padding:clamp(26px,5vw,46px);box-shadow:0 18px 54px rgba(30,41,59,.10)}.eyebrow{margin:0 0 10px;color:var(--accent-dark);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}.welcome h1{font-size:clamp(2.1rem,7vw,3.55rem);line-height:1.08;margin:0;letter-spacing:-.05em}.lead{margin:20px 0 0;color:var(--muted);font-size:1.05rem}.chips{display:flex;flex-wrap:wrap;gap:9px;margin:26px 0}.chip{padding:7px 11px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:.86rem;font-weight:700}.primary,.secondary{display:inline-flex;justify-content:center;align-items:center;min-height:50px;padding:12px 20px;border-radius:13px;border:0;font-weight:800;cursor:pointer;transition:transform .18s,background .18s}.primary{background:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(99,102,241,.26)}.primary:hover{background:var(--accent-dark);transform:translateY(-1px)}.secondary{background:#eef2ff;color:#4338ca}.secondary:hover{background:#e0e7ff}.notice{margin:19px 0 0;color:#64748b;font-size:.88rem}.progress-copy{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:.9rem;margin-bottom:11px}.track{height:8px;overflow:hidden;border-radius:99px;background:#e9edf8}.fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#6366f1,#a855f7);transition:width .25s}.question-label{margin:28px 0 10px;font-size:.85rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#6366f1}.question-title{margin:0;font-size:clamp(1.45rem,5vw,2rem);line-height:1.28;letter-spacing:-.03em}.options{display:grid;gap:12px;margin-top:28px}.option{width:100%;display:flex;align-items:flex-start;gap:14px;padding:17px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);text-align:left;cursor:pointer;transition:border .18s,background .18s,transform .18s}.option:hover{border-color:#a5b4fc;background:#f8faff;transform:translateY(-1px)}.option.selected{border-color:#6366f1;background:#eef2ff}.letter{display:grid;place-items:center;flex:0 0 30px;height:30px;border-radius:50%;background:#f1f5f9;color:#475569;font-size:.84rem;font-weight:900}.selected .letter{background:#6366f1;color:#fff}.transition{text-align:center;padding:40px 0}.spinner{width:52px;height:52px;margin:0 auto 20px;border:5px solid #e0e7ff;border-top-color:#6366f1;border-radius:50%;animation:spin .85s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.result-title{margin:0;font-size:clamp(2rem,7vw,3.3rem);line-height:1.08;letter-spacing:-.05em}.result-subtitle{margin:15px 0 0;color:var(--muted);font-size:1.05rem}.swatches{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:28px 0}.swatch{padding:16px;border-radius:17px;color:#172033}.swatch small{display:block;opacity:.72;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.swatch strong{display:block;margin-top:4px;font-size:1.12rem}.summary{margin:0;color:#334155}.tags{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0}.tags span{padding:7px 10px;border:1px solid #dbe3f0;border-radius:999px;color:#475569;font-size:.85rem;font-weight:700}.report{margin-top:29px;padding-top:28px;border-top:1px solid var(--line)}.report h2{margin:0 0 10px;font-size:1.35rem}.report h3{margin:21px 0 7px;font-size:1rem}.report p{margin:0;color:#475569}.report strong{color:#1e293b}.restart-note{margin-top:26px;padding:13px 15px;border-radius:12px;background:#f8fafc;color:#64748b;font-size:.9rem}.hidden{display:none}@media(max-width:520px){.shell{width:min(100% - 24px,720px);padding-top:20px}.card{border-radius:22px;padding:25px 20px}.swatches{grid-template-columns:1fr}.option{padding:14px}.question-title{font-size:1.4rem}}
  </style>
</head>
<body>
  <main id="app" class="shell" aria-live="polite"></main>
  <script>
    // Colors and questions for this test.
    const OUTER_COLORS = {
      A: { name: 'Sun Orange', short: 'Bright and Energetic', hex: '#f8c9af', text: '#733721', description: 'You tend to appear open, active, and ready to bring energy into a room.' },
      B: { name: 'Meadow Green', short: 'Calm and Supportive', hex: '#cfe7c6', text: '#285337', description: 'You tend to appear steady, considerate, and easy to approach.' },
      C: { name: 'Mist Blue', short: 'Thoughtful and Clear', hex: '#cae0f3', text: '#244d71', description: 'You tend to appear observant, composed, and quietly analytical.' },
      D: { name: 'Violet Haze', short: 'Distinct and Private', hex: '#dfd1ef', text: '#513169', description: 'You tend to appear independent, original, and a little hard to read.' }
    };

    const INNER_COLORS = {
      A: { name: 'Crimson', short: 'Driven and Adventurous', hex: '#f7c8c8', text: '#772c35', description: 'At your core, you are moved by momentum, expression, and the courage to act.' },
      B: { name: 'Moss Green', short: 'Gentle and Grounded', hex: '#cce4cc', text: '#2c5a3c', description: 'At your core, you value calm connection, trust, and a sense of safety.' },
      C: { name: 'Deep Sea Blue', short: 'Reflective and Insightful', hex: '#cad9ea', text: '#294867', description: 'At your core, you need room for reflection, depth, and meaningful ideas.' },
      D: { name: 'Night Violet', short: 'Imaginative and Free', hex: '#ded0ea', text: '#513567', description: 'At your core, you are drawn to creativity, possibility, and personal freedom.' }
    };

    const QUESTIONS = [
      {
        label: 'Outer Color',
        title: 'At a gathering or in a new environment, what first impression do you most often give?',
        options: {
          A: 'I energize the room and connect easily with people.',
          B: 'I seem gentle, quiet, and attentive to other people’s feelings.',
          C: 'I may speak less, but I tend to observe carefully and share clear opinions.',
          D: 'I seem a little distant or mysterious, which makes people curious.'
        }
      },
      {
        label: 'Outer Color',
        title: 'What kind of content do you most often share or explore online?',
        options: {
          A: 'Lively moments, humor, events, and what is happening now.',
          B: 'Small comforts, nature, food, and calming stories.',
          C: 'Books, films, analysis, practical knowledge, and thoughtful discussions.',
          D: 'Art, niche aesthetics, moody photography, and unusual ideas.'
        }
      },
      {
        label: 'Inner Color',
        title: 'When you are alone and nothing is expected of you, what state feels most familiar?',
        options: {
          A: 'I want connection, activity, or a new experience to look forward to.',
          B: 'I feel peaceful and soft, and I enjoy a slower natural rhythm.',
          C: 'My thoughts keep moving; I reflect, analyze, and have long inner conversations.',
          D: 'I imagine other worlds, follow inspiration, or want to escape the ordinary for a while.'
        }
      },
      {
        label: 'Inner Color',
        title: 'If you set aside every social role, what kind of person do you most want to become?',
        options: {
          A: 'A vivid adventurer who acts wholeheartedly and is not afraid of getting hurt.',
          B: 'A quietly growing person with a stable and gentle inner life.',
          C: 'A clear-minded observer with insight, depth, and mental freedom.',
          D: 'A free traveler who experiences many possible lives and resists easy labels.'
        }
      }
    ];

    const STORAGE_KEY = `onlineTestingResult_${window.__TEST_ACCESS__?.token || 'invalid'}`;
    const app = document.getElementById('app');
    const state = { answers: [], outerColor: null, innerColor: null, resultKey: null, timestamp: null };

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
    }

    function loadStoredState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (saved && Array.isArray(saved.answers)) Object.assign(state, saved);
      } catch (error) {
        console.warn('Unable to read the saved test state.', error);
      }
    }

    function saveState() {
      state.timestamp = Date.now();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function card(content) {
      app.innerHTML = `<section class="card">${content}</section>`;
    }

    function renderWelcome() {
      card(`
        <div class="welcome">
          <p class="eyebrow">Four-question reflection</p>
          <h1>Outer and Inner<br>Color Test</h1>
          <p class="lead">Explore the difference between how you usually appear and what matters most to you inside.</p>
          <div class="chips"><span class="chip">4 questions</span><span class="chip">About 1 minute</span><span class="chip">Saved automatically</span></div>
          <button class="primary" id="start">Start the test</button>
          <p class="notice">For entertainment and self-reflection only. This is not a psychological diagnosis.</p>
        </div>
      `);
      document.getElementById('start').addEventListener('click', () => renderQuestion(1));
    }

    function nextUnansweredQuestion() {
      return QUESTIONS.findIndex((_, index) => !state.answers.some(answer => answer.questionIndex === index + 1)) + 1;
    }

    function renderQuestion(questionIndex) {
      const question = QUESTIONS[questionIndex - 1];
      const selected = state.answers.find(answer => answer.questionIndex === questionIndex)?.optionLetter;
      const options = Object.entries(question.options).map(([letter, text]) => `
        <button class="option ${selected === letter ? 'selected' : ''}" data-letter="${letter}">
          <span class="letter">${letter}</span><span>${escapeHtml(text)}</span>
        </button>`).join('');
      const progress = ((questionIndex - 1) / QUESTIONS.length) * 100;
      card(`
        <div class="progress-copy"><span>Question ${questionIndex} of ${QUESTIONS.length}</span><span>${question.label}</span></div>
        <div class="track"><div class="fill" style="width:${progress}%"></div></div>
        <p class="question-label">${question.label}</p>
        <h1 class="question-title">${escapeHtml(question.title)}</h1>
        <div class="options">${options}</div>
      `);
      app.querySelectorAll('.option').forEach(button => button.addEventListener('click', () => answerQuestion(questionIndex, button.dataset.letter)));
    }

    function answerQuestion(questionIndex, optionLetter) {
      const existing = state.answers.findIndex(answer => answer.questionIndex === questionIndex);
      const answer = { questionIndex, optionLetter };
      if (existing >= 0) state.answers[existing] = answer;
      else state.answers.push(answer);
      state.answers.sort((left, right) => left.questionIndex - right.questionIndex);
      saveState();
      const next = nextUnansweredQuestion();
      if (next) setTimeout(() => renderQuestion(next), 220);
      else setTimeout(calculateResult, 260);
    }

    function calculateResult() {
      const byQuestion = new Map(state.answers.map(answer => [answer.questionIndex, answer.optionLetter]));
      state.outerColor = byQuestion.get(1) || byQuestion.get(2) || 'A';
      state.innerColor = byQuestion.get(3) || byQuestion.get(4) || 'A';
      state.resultKey = `${state.outerColor}_${state.innerColor}`;
      saveState();
      card('<div class="transition"><div class="spinner"></div><h1>Preparing your result…</h1><p class="lead">Looking at your outer and inner color combination.</p></div>');
      setTimeout(renderResult, 700);
    }

    function getResult() {
      const outer = OUTER_COLORS[state.outerColor] || OUTER_COLORS.A;
      const inner = INNER_COLORS[state.innerColor] || INNER_COLORS.A;
      return {
        outer,
        inner,
        title: `${outer.short} Outside, ${inner.short} Within`,
        summary: `Your outward style is ${outer.name}, while your inner preference is ${inner.name}. You may show ${outer.short.toLowerCase()} qualities first, even when your deeper needs are more ${inner.short.toLowerCase()}.`,
        tags: [outer.short, inner.short, 'Unique balance', 'Self-reflection'],
        strength: `Your combination can help you connect with others through ${outer.name} while making choices that respect your ${inner.name} core.`,
        growth: `Give both sides room: let people see your natural outward strengths, and also make time for the conditions that help your inner world feel restored.`
      };
    }

    function renderResult() {
      const result = getResult();
      card(`
        <p class="eyebrow">Your saved result</p>
        <h1 class="result-title">${escapeHtml(result.title)}</h1>
        <p class="result-subtitle">A reflection on how you show up and what supports you inside.</p>
        <div class="swatches">
          <div class="swatch" style="background:${result.outer.hex};color:${result.outer.text}"><small>Outer color</small><strong>${escapeHtml(result.outer.name)}</strong><span>${escapeHtml(result.outer.description)}</span></div>
          <div class="swatch" style="background:${result.inner.hex};color:${result.inner.text}"><small>Inner color</small><strong>${escapeHtml(result.inner.name)}</strong><span>${escapeHtml(result.inner.description)}</span></div>
        </div>
        <p class="summary">${escapeHtml(result.summary)}</p>
        <div class="tags">${result.tags.map(tag => `<span>${escapeHtml(tag)}</span>`).join('')}</div>
        <section class="report">
          <h2>Reflection notes</h2>
          <h3>Potential strength</h3><p>${escapeHtml(result.strength)}</p>
          <h3>Growth idea</h3><p>${escapeHtml(result.growth)}</p>
        </section>
        <p class="restart-note">This result is locked for this unique link. Opening the link again will show this same saved result.</p>
      `);
    }

    // If the participant returns, continue from the saved progress.
    loadStoredState();
    if (state.resultKey) renderResult();
    else if (state.answers.length) renderQuestion(nextUnansweredQuestion() || 1);
    else renderWelcome();

    console.info('Outer and Inner Color Test is ready.');
  </script>
</body>
</html>
