<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Unique Link Generator</title>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f6f7fb;color:#1f2937;font:15px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{max-width:620px;margin:48px auto;padding:30px;background:#fff;border-radius:20px;box-shadow:0 12px 36px rgba(15,23,42,.09)}h1{margin:0 0 8px;font-size:28px}p,small{color:#64748b}label{display:block;margin:17px 0 6px;font-weight:650}input,button,textarea{width:100%;font:inherit;border-radius:10px;padding:11px 12px;border:1px solid #cbd5e1}input:focus,textarea:focus{outline:2px solid #a5b4fc;border-color:#818cf8}button{margin-top:22px;border:0;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}button:hover{background:#4338ca}textarea{margin-top:16px;min-height:180px;resize:vertical}small{display:block;margin-top:10px}
  </style>
</head>
<body>
  <main class="card">
    <h1>Unique Link Generator</h1>
    <p>Each link remains available for five days from its first opening. After completion, the participant can only view the saved result.</p>
    <label for="secret">Administrator password</label>
    <input id="secret" type="password" autocomplete="current-password">
    <label for="label">Customer note (optional)</label>
    <input id="label" placeholder="Example: Order 20260801001">
    <label for="count">Number of links (1–100)</label>
    <input id="count" type="number" min="1" max="100" value="1">
    <button id="create">Generate unique links</button>
    <textarea id="output" readonly placeholder="Generated links will appear here"></textarea>
    <small>Copy the links into your order records. The system does not store names or phone numbers.</small>
  </main>
  <script>
    document.getElementById('create').addEventListener('click', async () => {
      const secret = document.getElementById('secret').value;
      const count = Number(document.getElementById('count').value);
      const customerLabel = document.getElementById('label').value.trim();
      const output = document.getElementById('output');
      output.value = 'Generating…';
      try {
        const response = await fetch('/api/admin/links', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${secret}` },
          body: JSON.stringify({ count, customerLabel })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Unable to generate links.');
        output.value = data.links.map((link, index) => `${index + 1}. ${link.url}`).join('\n');
      } catch (error) {
        output.value = `Error: ${error.message}`;
      }
    });
  </script>
</body>
</html>
