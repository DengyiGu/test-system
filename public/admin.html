<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专属链接生成器</title><style>body{margin:0;background:#fdf6f0;color:#3d302b;font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.card{max-width:620px;margin:48px auto;padding:28px;background:#fff;border-radius:20px;box-shadow:0 4px 24px #3c281e18}label{display:block;margin:14px 0 5px;font-weight:600}input,button,textarea{box-sizing:border-box;width:100%;font:inherit;border-radius:10px;padding:10px 12px;border:1px solid #dbcfc6}button{margin-top:20px;border:0;background:#d96e50;color:#fff;font-weight:700;cursor:pointer}textarea{margin-top:16px;min-height:180px;resize:vertical}small{color:#806e63}</style><main class="card"><h1>专属链接生成器</h1><p>链接从首次打开起保存 5 天；完成后只能查看结果，不能重新答题。</p><label>管理员密码</label><input id="secret" type="password"><label>客户备注（可选）</label><input id="label" placeholder="例如：订单号 20260801001"><label>生成数量（1–100）</label><input id="count" type="number" min="1" max="100" value="1"><button id="create">生成专属链接</button><textarea id="output" readonly placeholder="生成的链接将显示在这里"></textarea><small>请立即复制链接到订单记录；系统不会保存手机号或姓名。</small></main><script>document.getElementById('create').addEventListener('click',async()=>{const secret=document.getElementById('secret').value,count=Number(document.getElementById('count').value),customerLabel=document.getElementById('label').value.trim(),output=document.getElementById('output');output.value='正在生成…';try{const r=await fetch('/api/admin/links',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+secret},body:JSON.stringify({count,customerLabel})}),d=await r.json();if(!r.ok)throw new Error(d.error||'生成失败');output.value=d.links.map((x,i)=>`${i+1}. ${x.url}`).join('\n')}catch(e){output.value='错误：'+e.message}})</script></html>
